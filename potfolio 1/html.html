<html lang="en">

<head>

                    <div><strong>3</strong> posts</div>
                    <div><strong id="follower-count">500</strong> followers</div>
                    <div><strong>300</strong> following</div>
                </div>
                <p class="bio">jaipur</p>
                <p class="bio">vgu</p>

        </div>

                    alt="">
